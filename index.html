<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Prevent pinch-to-zoom and multi-touch zoom gestures on mobile browsers
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });
      document.addEventListener('touchmove', function (e) {
        if (e.scale !== undefined && e.scale !== 1) {
          e.preventDefault();
        }
      }, { passive: false });
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Primary SEO -->
    <title>Syniq — Memory Challenge</title>
    <meta name="author" content="Mopara Pair Ayat" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://syniq.moparapairayat.dev/" />
    <meta
      name="description"
      content="Train your memory, test your focus, and beat high scores in a fun cognitive challenge."
    />
    <meta
      name="keywords"
      content="memory game, simon game, brain training, cognitive challenge, sequence memory, free online game"
    />
    <meta name="theme-color" content="#101215" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Facebook / WhatsApp / Telegram / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Syniq" />
    <meta property="og:url" content="https://syniq.moparapairayat.dev/" />
    <meta property="og:title" content="Syniq — Memory Challenge" />
    <meta
      property="og:description"
      content="Train your memory, test your focus, and beat high scores in a fun cognitive challenge."
    />
    <meta property="og:image" content="https://syniq.moparapairayat.dev/og-image.png" />
    <meta property="og:image:secure_url" content="https://syniq.moparapairayat.dev/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Syniq Memory Challenge logo icon" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://syniq.moparapairayat.dev/" />
    <meta name="twitter:title" content="Syniq — Memory Challenge" />
    <meta
      name="twitter:description"
      content="Train your memory, test your focus, and beat high scores in a fun cognitive challenge."
    />
    <meta name="twitter:image" content="https://syniq.moparapairayat.dev/og-image.png" />
    <meta name="twitter:image:src" content="https://syniq.moparapairayat.dev/og-image.png" />
    <meta name="twitter:image:alt" content="Syniq Memory Challenge logo icon" />

    <!-- Mobile & PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Syniq" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Syniq" />

    <!-- JSON-LD Structured Data — VideoGame schema for Google rich results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "Syniq",
      "alternateName": "Syniq Memory Challenge",
      "description": "A premium, modern Simon-inspired memory challenge with 5 game modes: Classic, Speed Rush, Reverse, Time Attack, and Daily Challenge. Train your memory and cognitive reflexes.",
      "url": "https://syniq.moparapairayat.dev",
      "image": "https://syniq.moparapairayat.dev/og-image.png",
      "author": {
        "@type": "Person",
        "name": "Mopara Pair Ayat"
      },
      "genre": ["Puzzle", "Memory", "Brain Training", "Casual"],
      "gamePlatform": ["Web Browser", "Progressive Web App"],
      "applicationCategory": "Game",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5",
        "ratingCount": "1"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
