<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Prevent pinch-to-zoom and multi-touch zoom gestures on mobile browsers
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });
      document.addEventListener('touchmove', function (e) {
        if (e.scale !== undefined && e.scale !== 1) {
          e.preventDefault();
        }
      }, { passive: false });
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Primary SEO -->
    <title>Syniq — Modern Memory Challenge</title>
    <meta name="author" content="Mopara Pair Ayat" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://syniq.vercel.app/" />
    <meta
      name="description"
      content="Syniq is a premium Simon-inspired memory challenge. Train your brain with Classic, Speed Rush, Reverse, Time Attack & Daily Challenge modes. Free, no sign-up, installable as PWA."
    />
    <meta
      name="keywords"
      content="memory game, simon game, brain training, cognitive training, sequence memory, reaction game, pwa game, free browser game"
    />
    <meta name="theme-color" content="#101215" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Syniq" />
    <meta property="og:url" content="https://syniq.vercel.app" />
    <meta property="og:title" content="Syniq — Modern Memory Challenge" />
    <meta
      property="og:description"
      content="Test your memory and beat your friends! 🎮 Syniq is a free, premium Simon-inspired memory game with 5 modes. No sign-up needed. Play now!"
    />
    <meta property="og:image" content="https://syniq.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Syniq Memory Challenge — colorful Simon game board" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://syniq.vercel.app" />
    <meta name="twitter:title" content="Syniq — Modern Memory Challenge" />
    <meta
      name="twitter:description"
      content="Test your memory and beat your friends! 🎮 Syniq is a free, premium Simon-inspired memory game. No sign-up needed. Play now!"
    />
    <meta name="twitter:image" content="https://syniq.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Syniq Memory Challenge game board" />

    <!-- Mobile & PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Syniq" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Syniq" />

    <!-- JSON-LD Structured Data — VideoGame schema for Google rich results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "Syniq",
      "alternateName": "Syniq Memory Challenge",
      "description": "A premium, modern Simon-inspired memory challenge with 5 game modes: Classic, Speed Rush, Reverse, Time Attack, and Daily Challenge. Train your memory and cognitive reflexes.",
      "url": "https://syniq.vercel.app",
      "image": "https://syniq.vercel.app/og-image.png",
      "author": {
        "@type": "Person",
        "name": "Mopara Pair Ayat"
      },
      "genre": ["Puzzle", "Memory", "Brain Training", "Casual"],
      "gamePlatform": ["Web Browser", "Progressive Web App"],
      "applicationCategory": "Game",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5",
        "ratingCount": "1"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
